[project]
name = "sportsbook-odds-api"
version = "0.1.0"
description = "Prototype: NBA/NFL/MLB scores plus FanDuel, DraftKings and Pinnacle pregame odds behind a small read API"
requires-python = ">=3.11"
dependencies = ["fastapi==0.165.0", "uvicorn==0.54.0", "httpx==0.28.1"]

[project.optional-dependencies]
dev = ["pytest==9.2.0"]

[tool.setuptools]
packages = ["oddsapi", "oddsapi.adapters", "oddsapi.scores"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
